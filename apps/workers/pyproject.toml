[project]
name = "workers"
version = "0.1.0"
description = "Celery workers, one package per pipeline stage."
requires-python = ">=3.13"
dependencies = [
    # 5.6.3 declares Python support up to 3.13 only; 3.14 is CI-only "initial support".
    "celery[redis]>=5.6.3",
    # M1's ATS adapters. Sync Client only — Celery is the concurrency, so asyncio stays
    # out of the worker. Retries come from Celery's autoretry_for, not tenacity.
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    # M2's layer 2. Brings pandas + numpy + requests + tls-client with it, which is why
    # the import lives inside the task rather than at module scope — see
    # workers/tasks/scraping.py. Source pinned to a git sha in the workspace root.
    "python-jobspy",
    # M3's résumé text extraction. MIT, and the extras are the point: [pdf] is
    # pdfminer.six + pdfplumber, [docx] is mammoth + lxml, all permissively licensed.
    # PyMuPDF is 8-12x faster and AGPL-3.0, whose network clause would force this
    # service open-source — see docs/DECISIONS.md.
    "markitdown[docx,pdf]>=0.1.6",
    # M5's renderer, chosen in CLAUDE.md §7.2 and named "use as-is" in Part 12. MIT,
    # Typst-based rather than LaTeX, and every theme is single-column — the one layout
    # property that actually breaks ATS parsers. [full] is what brings `typst`, whose
    # wheel bundles the compiler (manylinux aarch64 included, so the M1 box needs no
    # system binary and no network at render time) and `rendercv-fonts`, so the image
    # needs no fontconfig either.
    #
    # Driven through its CLI, never its Python API: its own docs say "RenderCV is a CLI
    # application, not a library. Its internal API is not guaranteed to be stable."
    "rendercv[full]>=2.8",
    "db",
    "schemas",
    "storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
