[project]
name = "workers"
version = "0.1.0"
description = "Celery workers, one package per pipeline stage."
requires-python = ">=3.13"
dependencies = [
    # 5.6.3 declares Python support up to 3.13 only; 3.14 is CI-only "initial support".
    "celery[redis]>=5.6.3",
    # M1's ATS adapters. Sync Client only — Celery is the concurrency, so asyncio stays
    # out of the worker. Retries come from Celery's autoretry_for, not tenacity.
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    # M2's layer 2. Brings pandas + numpy + requests + tls-client with it, which is why
    # the import lives inside the task rather than at module scope — see
    # workers/tasks/scraping.py. Source pinned to a git sha in the workspace root.
    "python-jobspy",
    "db",
    "schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
