<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 360px;
        font-family: -apple-system, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      select {
        width: 100%;
        margin-bottom: 10px;
        padding: 4px;
      }
      .row {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .row .title {
        font-weight: 600;
        font-size: 13px;
      }
      .row .sub {
        font-size: 11px;
        color: #666;
        margin-bottom: 6px;
      }
      button {
        width: 100%;
        padding: 6px;
        border: none;
        border-radius: 4px;
        background: #111;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .empty,
      .status {
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>ApplyLoop</h1>
    <select id="user"></select>
    <div id="list"></div>
    <script src="popup.js"></script>
  </body>
</html>
